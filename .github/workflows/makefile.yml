name: Build GKI Kernel AOSP Clang r450784d
# 关键：必须写 workflow_dispatch 才能出现手动运行按钮
on:
  push:
    branches:
      - main
      - kernel
  pull_request:
  workflow_dispatch:  # 此行是手动触发开关，缺一不可
    inputs:
      target_defconfig:
        description: 内核编译Defconfig
        required: true
        default: gki_defconfig
      target_arch:
        description: CPU架构 arm64/arm
        required: true
        default: arm64

env:
  ANDROID_VERSION: "32"
  CLANG_VER: "r407598"
  KERNEL_ROOT: ${{ github.workspace }}
  BUILD_OUTPUT: out/kernel

jobs:
  build_kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: 扩容磁盘空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex bc git zip unzip wget curl python3 cpio rsync lz4

      - name: 拉取内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 缓存工具链，解决工具链连接失败问题
      - name: 缓存 Clang & GCC 工具链
        id: cache_toolchain
        uses: actions/cache@v3
        with:
          path: |
            prebuilts/clang/host/linux-x86/clang-${{ env.CLANG_VER }}
            prebuilts/gcc/linux-x86/aarch64-linux-android-4.9
          key: toolchain-${{ env.CLANG_VER }}-a34

      - name: 下载 AOSP Clang r450784d
        if: steps.cache_toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p prebuilts/clang/host/linux-x86
          cd prebuilts/clang/host/linux-x86
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz -O clang.tar.gz  
          mkdir clang-${{ env.CLANG_VER }}
          tar -xf clang.tar.gz -C clang-${{ env.CLANG_VER }}
          rm -f clang.tar.gz

      - name: 下载 AOSP GCC 4.9 交叉编译器
        if: steps.cache_toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p prebuilts/gcc/linux-x86
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          
      - name: 导入编译环境变量
        run: |
          echo "PATH=${{ github.workspace }}/prebuilts/clang/host/linux-x86/clang-${{ env.CLANG_VER }}/bin:${{ github.workspace }}/prebuilts/gcc/linux-x86/aarch64-linux-android-4.9/bin:$PATH" >> $GITHUB_ENV

      - name: 清理旧编译文件
        run: make O=${{ env.BUILD_OUTPUT }} clean

      - name: 生成Defconfig
        run: |
          make O=${{ env.BUILD_OUTPUT }} ARCH=${{ github.event.inputs.target_arch }} ${{ github.event.inputs.target_defconfig }}
          echo "CONFIG_CC_IS_CLANG=y" >> ${{ env.BUILD_OUTPUT }}/.config
          echo "CONFIG_GCC_COMPAT=y" >> ${{ env.BUILD_OUTPUT }}/.config

      - name: 编译GKI内核 Image + dtbo
        run: |
          make -j$(nproc) O=${{ env.BUILD_OUTPUT }} \
            ARCH=${{ github.event.inputs.target_arch }} \
            CC=clang CXX=clang++ LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            Image Image.lz4 dtbo.img

      - name: 编译boot.img
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg mkboot
          python3 mkboot/mkbootimg.py \
            --kernel ${{ env.BUILD_OUTPUT }}/arch/arm64/boot/Image.lz4 \
            --header_version 4 \
            -o boot.img

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: GKI-Kernel-Output
          path: |
            boot.img
            ${{ env.BUILD_OUTPUT }}/arch/arm64/boot/dtbo.img
            ${{ env.BUILD_OUTPUT }}/.config
