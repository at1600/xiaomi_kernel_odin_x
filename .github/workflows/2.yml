name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 缓存Clang工具链，避免每次重复下载
      - name: Cache AOSP Clang r450784d
        uses: actions/cache@v4
        with:
          path: toolchain/clang
          key: clang-r450784d-android34

      # 中科大镜像下载Clang，彻底避开google源503限流
      - name: Download Clang Toolchain (USTC Mirror)
        run: |
          if [ ! -d "toolchain/clang/bin" ]; then
            mkdir -p toolchain/clang
            wget --retry-connrefused --waitretry=10 --timeout=60 --tries=10 \
            https://mirrors.ustc.edu.cn/aosp/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android34-release/clang-r450784d.tar.gz \
            -O clang.tar.gz
            tar -xf clang.tar.gz -C toolchain/clang
            rm -rf clang.tar.gz
          fi

      # 内核编译Action，关闭内置clang下载，使用本地预下载工具链
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/at1600/xiaomi_kernel_odin_x
          kernel-dir: msm-5.4
          kernel-branch: main
          config: odin_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: false
          android-version: 34
          aosp-clang-version: r450784d
          clang-path: ${{ github.workspace }}/toolchain/clang
          disable-lto: true
          anykernel3: true
